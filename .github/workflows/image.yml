name: "image"

on:
  workflow_call:
    inputs:
      push:
        description: "Push image to registry"
        type: "boolean"
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        type: "boolean"
        default: false

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "fluent-bit-clp"

jobs:
  build:
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      - uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c"  # v4.2.0

      - uses: "docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4"  # v4.3.0
        if: "${{ inputs.push }}"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract metadata"
        id: "meta"
        uses: "docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302"  # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          # `latest=auto` tags `:latest` on non-pre-release semver releases (e.g. v1.2.3) while
          # leaving pre-releases (e.g. v1.2.3-rc1) off `:latest`.
          flavor: "latest=auto"
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: "Build and push"
        uses: "docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a"  # v7.3.0
        with:
          context: "."
          file: "plugins/out_clp_s3/Dockerfile"
          platforms: "linux/amd64"
          push: "${{ inputs.push || false }}"
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
