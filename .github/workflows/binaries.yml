name: "binaries"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to upload assets to"
        type: "string"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: "amd64"
            runner: "ubuntu-24.04"
            manylinux: "quay.io/pypa/manylinux_2_28_x86_64@sha256:35795c40ab9eed587a0f51a752c7defeabcc8a2ccd434d3497be201cdd34cb63"  # 2026.06.28-1
    runs-on: "${{ matrix.runner }}"
    container:
      image: "${{ matrix.manylinux }}"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: "Install Go"
        uses: "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16"  # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: "Install Task"
        uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.49.1"

      - name: "Build plugin"
        working-directory: "plugins/out_clp_s3"
        env:
          GOFLAGS: "-buildvcs=false"
        run: task build

      - name: "Create release archive"
        working-directory: "plugins/out_clp_s3"
        run: tar -czvf out_clp_s3-linux-${{ matrix.arch }}.tar.gz out_clp_s3.so

      - name: "Upload artifact"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "out_clp_s3-linux-${{ matrix.arch }}"
          path: "plugins/out_clp_s3/out_clp_s3-linux-${{ matrix.arch }}.tar.gz"

  release:
    if: "${{ inputs.release_tag != '' }}"
    needs: ["build"]
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "write"
    steps:
      - name: "Download build artifacts"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1
        with:
          pattern: "out_clp_s3-linux-*"
          path: "release-assets"

      - name: "Upload to release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_TAG: "${{ inputs.release_tag }}"
          GH_REPO: "${{ github.repository }}"
        shell: "bash"
        run: |
          shopt -s nullglob
          assets=(release-assets/**/*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets found under release-assets/" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
