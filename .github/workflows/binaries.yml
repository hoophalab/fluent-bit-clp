name: "binaries"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to upload assets to"
        type: "string"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: "amd64"
            runner: "ubuntu-24.04"
            manylinux: "quay.io/pypa/manylinux_2_28_x86_64@sha256:35795c40ab9eed587a0f51a752c7defeabcc8a2ccd434d3497be201cdd34cb63"  # 2026.06.28-1
    runs-on: "${{ matrix.runner }}"
    container:
      image: "${{ matrix.manylinux }}"
    permissions:
      contents: "write"
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: "Install Go"
        uses: "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16"  # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: "Install Task"
        uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - name: "Build plugin"
        working-directory: "plugins/out_clp_s3"
        env:
          # The checkout is owned by a different user than the container runs as, so disable VCS
          # stamping to avoid Git "dubious ownership" errors.
          GOFLAGS: "-buildvcs=false"
        run: task build LDFLAGS="-s -w"

      - name: "Create release archive"
        working-directory: "plugins/out_clp_s3"
        run: tar -czvf out_clp_s3-linux-${{ matrix.arch }}.tar.gz out_clp_s3.so

      - name: "Upload artifact"
        if: "${{ inputs.release_tag == '' }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "out_clp_s3-linux-${{ matrix.arch }}"
          path: "plugins/out_clp_s3/out_clp_s3-linux-${{ matrix.arch }}.tar.gz"

      - name: "Upload to release"
        if: "${{ inputs.release_tag != '' }}"
        working-directory: "plugins/out_clp_s3"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh release upload "${{ inputs.release_tag }}" out_clp_s3-linux-${{ matrix.arch }}.tar.gz --repo "${{ github.repository }}" --clobber
